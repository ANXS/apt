---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: "anxs-apt-${MOLECULE_OS:-debian}-${MOLECULE_VERSION:-12}-${APT_UPGRADE:-false}-${APT_UPGRADE_STYLE:-safe}-${APT_UPGRADE_FREQUENCY:-once}"
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    command: /sbin/init
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../..:${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles"
    APT_UPGRADE: "${APT_UPGRADE:-false}"
    APT_UPGRADE_STYLE: "${APT_UPGRADE_STYLE:-safe}"
    APT_UPGRADE_FREQUENCY: "${APT_UPGRADE_FREQUENCY:-once}"
    APT_UNATTENDED_UPGRADES: "${APT_UNATTENDED_UPGRADES:-preserve}"
    APT_MANAGE_TIMER_SCHEDULE: "${APT_MANAGE_TIMER_SCHEDULE:-false}"
    APT_DAILY_TIMER_ON_CALENDAR: "${APT_DAILY_TIMER_ON_CALENDAR:-*-*-* 03:15}"
    APT_DAILY_TIMER_RANDOMIZED_DELAY_SEC: "${APT_DAILY_TIMER_RANDOMIZED_DELAY_SEC:-30m}"
    APT_DAILY_UPGRADE_TIMER_ON_CALENDAR: "${APT_DAILY_UPGRADE_TIMER_ON_CALENDAR:-Mon..Fri *-*-* 04:30}"
    APT_DAILY_UPGRADE_TIMER_RANDOMIZED_DELAY_SEC: "${APT_DAILY_UPGRADE_TIMER_RANDOMIZED_DELAY_SEC:-15m}"

verifier:
  name: testinfra
  directory: tests
  env:
    APT_UPGRADE: "${APT_UPGRADE:-false}"
    APT_UPGRADE_FREQUENCY: "${APT_UPGRADE_FREQUENCY:-once}"
    APT_UNATTENDED_UPGRADES: "${APT_UNATTENDED_UPGRADES:-preserve}"
    APT_MANAGE_TIMER_SCHEDULE: "${APT_MANAGE_TIMER_SCHEDULE:-false}"
    APT_DAILY_TIMER_ON_CALENDAR: "${APT_DAILY_TIMER_ON_CALENDAR:-*-*-* 03:15}"
    APT_DAILY_TIMER_RANDOMIZED_DELAY_SEC: "${APT_DAILY_TIMER_RANDOMIZED_DELAY_SEC:-30m}"
    APT_DAILY_UPGRADE_TIMER_ON_CALENDAR: "${APT_DAILY_UPGRADE_TIMER_ON_CALENDAR:-Mon..Fri *-*-* 04:30}"
    APT_DAILY_UPGRADE_TIMER_RANDOMIZED_DELAY_SEC: "${APT_DAILY_UPGRADE_TIMER_RANDOMIZED_DELAY_SEC:-15m}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
